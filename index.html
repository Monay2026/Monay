<!-- هذا الكود لغرض تعليمي لبناء واجهة دردشة -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex">

    <!-- الشريط الجانبي -->
    <div class="w-64 bg-gray-900 text-white p-4">
        <h2 class="text-xl font-bold mb-6">محادثاتي</h2>
        <ul>
            <li class="p-2 bg-gray-800 rounded mb-2">محادثة جديدة</li>
        </ul>
    </div>

    <!-- منطقة الدردشة -->
    <div class="flex-1 flex flex-col">
        <div class="flex-1 p-6 overflow-y-auto">
            <!-- رسالة المستخدم -->
            <div class="bg-white p-4 rounded-lg shadow mb-4 self-end">أهلاً، كيف يمكنني مساعدتك؟</div>
            <!-- رسالة البوت -->
            <div class="bg-blue-100 p-4 rounded-lg shadow mb-4">أهلاً بك! أنا جاهز للمساعدة.</div>
        </div>

        <!-- صندوق الإدخال -->
        <div class="p-4 bg-white border-t">
            <input type="text" class="w-full p-3 border rounded-lg" placeholder="اكتب رسالتك هنا...">
        </div>
    </div>

</body>
</html>
