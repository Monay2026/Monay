<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات مناي فلسطين | الشات المباشر</title>
<style type="text/css">
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f2f4f7; font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header { background-color: #1895d2; padding: 10px 0; text-align: center; color: #fff; flex-shrink: 0; }
.header h1 { font-size: 20px; }

/* شاشة كاملة ملء المساحة */
.main { flex: 1; display: flex; max-width: 100%; width: 100%; padding: 5px; gap: 5px; height: calc(100vh - 45px); }

.login-box { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; max-width: 400px; margin: auto; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.login-box input, .login-box select { width: 100%; padding: 10px; margin-bottom: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
.login-box button { width: 100%; padding: 10px; background: #f97360; color: #fff; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; }

.chat-container { display: none; width: 100%; height: 100%; display: flex; gap: 8px; }
.chat-main { flex: 4; display: flex; flex-direction: column; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; min-width: 0; }
.chat-sidebar { flex: 1.2; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; max-height: 100%; overflow-y: auto; }
.chat-sidebar h4 { font-size: 13px; color: #377ca8; margin-bottom: 6px; border-bottom: 1px solid #ddd; padding-bottom: 4px; text-align: center; }

.users-list { list-style: none; font-size: 12px; color: #333; text-align: right; }
.users-list li { padding: 5px 6px; border-bottom: 1px dashed #eee; display: flex; align-items: center; gap: 5px; cursor: pointer; border-radius: 4px; }
.users-list li:hover { background: #e3f0f7; }
.users-list li::before { content: "•"; color: #28a745; font-size: 16px; }

.chat-messages { flex: 1; background: #fafafa; border: 1px solid #eee; border-radius: 5px; padding: 10px; overflow-y: auto; margin-bottom: 6px; text-align: right; }

/* السمايلات السريعة */
.emojis-bar { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; }
.emoji-btn { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 3px 6px; cursor: pointer; font-size: 15px; }

.chat-input-area { display: flex; gap: 5px; }
.chat-input-area input { flex: 1; padding: 9px; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; }
.chat-input-area button { padding: 9px 15px; background: #377ca8; color: #fff; border: none; border-radius: 5px; cursor: pointer; }

.error { color: maroon; background: #f8d7da; padding: 8px; margin-bottom: 12px; border-radius: 5px; display: none; text-align: center; font-size: 14px; }
.msg { margin-bottom: 8px; padding: 8px 12px; background: #e3f0f7; border-radius: 6px; display: inline-block; max-width: 85%; word-break: break-word; }
.msg b { color: #1895d2; margin-left: 5px; }
.admin-msg { background: #fff3cd !important; border: 1px solid #ffeeba; }
.admin-msg b { color: #856404 !important; }
.msg span { font-size: 11px; color: #888; display: block; margin-top: 3px; text-align: left; }

/* نافذة منبثقة (Modal) لملف المستخدم أو الدردشة الخاصة */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
.modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.modal-content h3 { color: #1895d2; margin-bottom: 10px; font-size: 16px; }
.modal-content p { font-size: 14px; color: #333; margin-bottom: 15px; }
.modal-btn { background: #1895d2; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin: 3px; font-size: 13px; }
.modal-close { background: #d9534f; }
</style>
</head>
<body>

  <div class="header">
     <h1>شات مناي فلسطين 🇵🇸</h1>
  </div>

  <div class="main">
    
    <!-- واجهة تسجيل الدخول -->
    <div class="login-box" id="loginSection">
      <h3 style="text-align:center; margin-bottom:15px; color:#333;">تسجيل دخول ضيف</h3>
      <div class="error" id="errorMsg">يرجى إكمال البيانات</div>
      <input type="text" id="usernameInput" maxlength="30" placeholder="أدخل إسمك المستعار..." autocomplete="off" autofocus>
      <select id="genderInput">
        <option value="" selected disabled>تحديد الجنس</option>
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
      <button id="enterChatBtn">دخول إلى الشات</button>
    </div>

    <!-- واجهة غرفة الدردشة والقائمة الجانبية -->
    <div class="chat-container" id="chatSection">
      
      <div class="chat-main">
        <div style="margin-bottom: 6px; font-weight: bold; color: #377ca8; display:flex; justify-content:space-between; align-items:center;">
          <span id="roomTitle" style="font-size: 13px;">الغرفة العامة</span>
          <div>
            <button id="backToGeneral" style="display:none; background:#5bc0de; color:#fff; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:11px; margin-left:5px;">العامة</button>
            <button onclick="location.reload()" style="background:#d9534f; color:#fff; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:11px;">خروج</button>
          </div>
        </div>
        
        <div class="chat-messages" id="messagesList">
          <div style="text-align:right;"><div class="msg"><b>الإدارة:</b> أهلاً بك في شات مناي فلسطين الشامل! 🇵🇸</div></div>
        </div>

        <!-- شريط السمايلات السريعة -->
        <div class="emojis-bar">
          <button class="emoji-btn" onclick="addEmoji('😊')">😊</button>
          <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
          <button class="emoji-btn" onclick="addEmoji('🇵🇸')">🇵🇸</button>
          <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
          <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
          <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
          <button class="emoji-btn" onclick="addEmoji('🌹')">🌹</button>
          <button class="emoji-btn" onclick="addEmoji('👋')">👋</button>
        </div>

        <div class="chat-input-area">
          <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
          <button id="sendBtn">إرسال</button>
        </div>
      </div>

      <!-- القائمة الجانبية للمتصلين -->
      <div class="chat-sidebar">
        <h4>المتصلون</h4>
        <ul class="users-list" id="usersList"></ul>
      </div>

    </div>

  </div>

  <!-- نافذة خيارات المستخدم المنبثقة -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <h3 id="modalUserName">اسم المستخدم</h3>
      <p id="modalUserInfo">معلومات المستخدم...</p>
      <button class="modal-btn" id="modalChatBtn">دردشة خاصة</button>
      <button class="modal-btn modal-close" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
    databaseURL: "https://chatarab2026m-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const loginSection = document.getElementById('loginSection');
const chatSection = document.getElementById('chatSection');
const enterChatBtn = document.getElementById('enterChatBtn');
const usernameInput = document.getElementById('usernameInput');
const genderInput = document.getElementById('genderInput');
const errorMsg = document.getElementById('errorMsg');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const messagesList = document.getElementById('messagesList');
const usersList = document.getElementById('usersList');
const roomTitle = document.getElementById('roomTitle');
const backToGeneral = document.getElementById('backToGeneral');

const userModal = document.getElementById('userModal');
const modalUserName = document.getElementById('modalUserName');
const modalUserInfo = document.getElementById('modalUserInfo');
const modalChatBtn = document.getElementById('modalChatBtn');

let currentName = "";
let currentGender = "";
let userRef = null;
let isAdmin = false;
let currentChatTarget = "general"; // general أو اسم شخص للخاص

enterChatBtn.addEventListener('click', proceedToChat);
usernameInput.addEventListener('keypress', function(e) { if(e.key === 'Enter') proceedToChat(); });

function proceedToChat() {
    let name = usernameInput.value.trim();
    let gender = genderInput.value;

    if(name === "") {
        errorMsg.innerText = "يرجى إدخال الاسم المستعار للمتابعة.";
        errorMsg.style.display = 'block';
        return;
    }
    if(!gender) {
        errorMsg.innerText = "يرجى تحديد الجنس للمتابعة.";
        errorMsg.style.display = 'block';
        return;
    }

    currentName = name;
    currentGender = gender;
    
    let lowerName = name.toLowerCase();
    if(lowerName.includes('مدير') || lowerName.includes('مشرف') || lowerName.includes('admin')) {
        isAdmin = true;
        currentName = "👑 " + name;
    }

    loginSection.style.display = 'none';
    chatSection.style.display = 'flex';
    messageInput.focus();

    userRef = db.ref('online_users').push();
    userRef.set({ name: currentName, gender: currentGender, isAdmin: isAdmin });
    userRef.onDisconnect().remove();

    loadMessages();
}

function addEmoji(emoji) {
    messageInput.value += emoji;
    messageInput.focus();
}

sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', function(e) {
    if(e.key === 'Enter') sendMessage();
});

function sendMessage() {
    let text = messageInput.value.trim();
    if(text === "") return;

    if(currentChatTarget === "general") {
        db.ref('messages').push({
            username: currentName,
            text: text,
            isAdmin: isAdmin,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    } else {
        // رسالة خاصّة
        db.ref('private_messages').push({
            sender: currentName,
            receiver: currentChatTarget,
            text: text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    }

    messageInput.value = "";
}

// جلب وتحديث قائمة المتصلين مع إمكانية الضغط عليهم
db.ref('online_users').on('value', function(snapshot) {
    usersList.innerHTML = '';
    snapshot.forEach(function(childSnapshot) {
        let userData = childSnapshot.val();
        let li = document.createElement('li');
        li.innerText = userData.name;
        if(userData.isAdmin) {
            li.style.color = '#856404';
            li.style.fontWeight = 'bold';
        }
        
        // عند الضغط على اسم المستخدم تظهر نافذة الخيارات
        li.onclick = function() {
            openUserProfile(userData);
        };

        usersList.appendChild(li);
    });
});

function openUserProfile(userData) {
    modalUserName.innerText = userData.name;
    modalUserInfo.innerHTML = `الجنس: ${userData.gender || 'غير محدد'}<br>الحالة: متصل الآن`;
    
    modalChatBtn.onclick = function() {
        closeModal();
        startPrivateChat(userData.name);
    };

    userModal.style.display = 'flex';
}

function closeModal() {
    userModal.style.display = 'none';
}

function startPrivateChat(targetName) {
    if(targetName === currentName) return;
    currentChatTarget = targetName;
    roomTitle.innerText = "دردشة خاصة مع: " + targetName;
    backToGeneral.style.display = 'inline-block';
    messagesList.innerHTML = `<div style="text-align:center; color:#888; font-size:12px;">بدء محادثة خاصّة آمنة مع ${targetName}</div>`;
    loadPrivateMessages();
}

backToGeneral.onclick = function() {
    currentChatTarget = "general";
    roomTitle.innerText = "الغرفة العامة";
    backToGeneral.style.display = 'none';
    messagesList.innerHTML = '';
    loadMessages();
};

function loadMessages() {
    db.ref('messages').off();
    messagesList.innerHTML = '';
    db.ref('messages').limitToLast(50).on('child_added', function(snapshot) {
        if(currentChatTarget !== "general") return;
        let data = snapshot.val();
        let container = document.createElement('div');
        container.style.textAlign = 'right';
        let msgClass = data.isAdmin ? 'msg admin-msg' : 'msg';
        container.innerHTML = `<div class="${msgClass}"><b>${data.username}:</b> ${data.text}<span>${data.time || ''}</span></div>`;
        messagesList.appendChild(container);
        messagesList.scrollTop = messagesList.scrollHeight;
    });
}

function loadPrivateMessages() {
    db.ref('private_messages').off();
    db.ref('private_messages').on('child_added', function(snapshot) {
        if(currentChatTarget === "general") return;
        let data = snapshot.val();
        
        // التحقق من أن الرسالة تخص الطرفين
        let isRelevant = (data.sender === currentName && data.receiver === currentChatTarget) || 
                         (data.sender === currentChatTarget && data.receiver === currentName);
        
        if(isRelevant) {
            let container = document.createElement('div');
            container.style.textAlign = (data.sender === currentName) ? 'left' : 'right';
            let bgStyle = (data.sender === currentName) ? 'background: #d4edda;' : 'background: #e3f0f7;';
            container.innerHTML = `<div class="msg" style="${bgStyle}"><b>${data.sender}:</b> ${data.text}<span>${data.time || ''}</span></div>`;
            messagesList.appendChild(container);
            messagesList.scrollTop = messagesList.scrollHeight;
        }
    });
}
</script>

</body>
</html>
