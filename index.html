<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات مناي فلسطين PS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d1b2a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* شاشة تسجيل الدخول */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d1b2a; display: flex; justify-content: center; align-items: center; z-index: 200; }
        .login-box { background: #1b263b; padding: 25px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #334155; text-align: center; }
        .login-box h3 { color: #4ea8de; }
        .login-box input, .login-box select { width: 100%; padding: 10px; border-radius: 5px; border: none; outline: none; background: #0d1b2a; color: #fff; font-size: 14px; }
        .login-box button { background: #d90429; color: #fff; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }

        /* شاشة المتصلين */
        #onlineScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d1b2a; z-index: 150; flex-direction: column; }
        .online-header { background: #0b131d; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2a38; font-weight: bold; }
        .back-btn { background: #d90429; color: #fff; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .online-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .online-user-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .admin-user { color: #ffc107; font-weight: bold; }

        /* شريط العلوي */
        .top-bar { background-color: #0b131d; display: flex; justify-content: space-around; padding: 10px 5px; border-bottom: 1px solid #1c2a38; font-size: 11px; }
        .top-item { display: flex; flex-direction: column; align-items: center; color: #ccc; cursor: pointer; }

        /* الشات الرئيسي */
        .main-chat-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .message { background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .user-name { font-weight: bold; color: #4ea8de; margin-left: 5px; }
        .admin-msg .user-name { color: #ffc107; }

        /* صندوق الإرسال */
        .input-bar { background: #0b131d; padding: 8px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #1c2a38; }
        .input-bar input { flex: 1; background: #1b263b; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; font-size: 14px; outline: none; }
        .input-bar button { background: #1b4332; border: none; color: #fff; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }

        /* القائمة السفلية */
        .bottom-nav { background-color: #080f17; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #1c2a38; font-size: 11px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a5b4fc; cursor: pointer; }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول -->
    <div id="loginScreen">
        <div class="login-box">
            <h3>تسجيل دخول ضيف 🇵🇸</h3>
            <input type="text" id="guestName" placeholder="أدخل إسمك المستعار...">
            <select id="guestGender">
                <option value="">تحديد الجنس</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
            <button onclick="enterChat()">دخول إلى الشات</button>
        </div>
    </div>

    <!-- واجهة المتصلين -->
    <div id="onlineScreen">
        <div class="online-header">
            <span>المتصلون الآن (<span id="onlineCount">0</span>)</span>
            <button class="back-btn" onclick="backToChat()">رجوع</button>
        </div>
        <div class="online-body" id="onlineUsersList"></div>
    </div>

    <!-- واجهة الشات العام -->
    <div class="main-chat-wrapper">
        <div class="top-bar">
            <div class="top-item">⚙️<span>إعدادات</span></div>
            <div class="top-item">🔔<span>إشعار</span></div>
            <div class="top-item">📥<span>طلب</span></div>
            <div class="top-item">✉️<span>رسالة</span></div>
            <div class="top-item">👑<span>الأثرياء</span></div>
            <div class="top-item">💎<span>الكبار</span></div>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-bar">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">إرسال</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item">🎛️<span>خيارات</span></div>
            <div class="nav-item" onclick="showOnlineScreen()">👥<span>المتصلين</span></div>
            <div class="nav-item">⭐<span>الأصدقاء</span></div>
            <div class="nav-item">🏠<span>الغرف</span></div>
            <div class="nav-item">📻<span>Radio</span></div>
        </div>
    </div>

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "chatarab2026m.firebaseapp.com",
            databaseURL: "https://chatarab2026m-default-rtdb.firebaseio.com/",
            projectId: "chatarab2026m",
            storageBucket: "chatarab2026m.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUserName = "";
        let currentGender = "";
        let isAdmin = false;
        let userRef = null;

        // الدخول للشات
        function enterChat() {
            let name = document.getElementById('guestName').value.trim();
            let gender = document.getElementById('guestGender').value;
            if(name === '' || gender === '') { alert('الرجاء إكمال البيانات'); return; }
            
            currentUserName = name;
            currentGender = gender;
            
            // تخصيص صلاحيات الإدارة تلقائياً لمن يكتب كلمة مدير أو admin بالاسم
            if(name.toLowerCase().includes('مدير') || name.toLowerCase().includes('admin')){
                isAdmin = true;
                currentUserName = "👑 " + name;
            }

            document.getElementById('loginScreen').style.display = 'none';
            
            // تسجيل المستخدم في قائمة المتصلين مع ميزة الحذف التلقائي عند الخروج
            userRef = db.ref('online_users').push();
            userRef.set({name: currentUserName, gender: currentGender, isAdmin: isAdmin});
            userRef.onDisconnect().remove();

            loadMessages();
        }

        // إرسال رسالة
        function sendMessage() {
            let input = document.getElementById('messageInput');
            let text = input.value.trim();
            if(text !== '') {
                db.ref('messages').push({
                    name: currentUserName,
                    text: text,
                    isAdmin: isAdmin,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });
                input.value = '';
            }
        }

        // جلب وعرض الرسائل لحظياً
        function loadMessages() {
            db.ref('messages').limitToLast(100).on('child_added', (snapshot) => {
                let data = snapshot.val();
                let container = document.getElementById('chatContainer');
                let msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + (data.isAdmin ? 'admin-msg' : '');
                msgDiv.innerHTML = `<div><span class="user-name">${data.name}:</span> ${data.text} <span style="float:left; font-size:10px; color:#888;">${data.time}</span></div>`;
                container.appendChild(msgDiv);
                container.scrollTop = container.scrollHeight;
            });
        }

        // فتح نافذة المتصلين
        function showOnlineScreen() {
            document.getElementById('onlineScreen').style.display = 'flex';
            let onlineList = document.getElementById('onlineUsersList');
            let onlineCount = document.getElementById('onlineCount');

            db.ref('online_users').on('value', (snapshot) => {
                onlineList.innerHTML = '';
                let count = 0;
                snapshot.forEach((childSnapshot) => {
                    let user = childSnapshot.val();
                    count++;
                    let item = document.createElement('div');
                    item.className = 'online-user-item';
                    item.innerHTML = `<span class="${user.isAdmin ? 'admin-user' : ''}">${user.name}</span> <span>🟢 متصل</span>`;
                    onlineList.appendChild(item);
                });
                onlineCount.innerText = count;
            });
        }

        // زر الرجوع للشات العام
        function backToChat() {
            document.getElementById('onlineScreen').style.display = 'none';
        }
    </script>
</body>
</html>
